seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  source_lang: en
  target_lang: id
  ccmatrix:
    hf_dataset: yhavinga/ccmatrix
    hf_config: en-id
    # CCMatrix is ordered by LASER margin score; taking the first N pairs
    # doubles as quality filtering. Adjust to your compute budget.
    # Raw pairs downloaded for preprocessing. 2.3M provides headroom for
    # cleaning losses while retaining exactly 2M training  10k testing pairs.
    max_pairs: 2010000
  flores:
    hf_dataset: facebook/flores
    hf_config: eng_Latn-ind_Latn
    source_field: sentence_eng_Latn
    target_field: sentence_ind_Latn
  # Exact retained split sizes after cleaning.  The validation split is used
  # for early stopping and hyperparameter tuning; FLORES devtest remains the
  # untouched final evaluation set.
  train_size: 2000000
  validation_size: 10000

preprocessing:
  # OpusFilter-style heuristics (Aulamo et al., 2020).
  min_words: 1              # LengthFilter: keep segments with 1..max_words words
  max_words: 100
  max_length_ratio: 3.0     # LengthRatioFilter: drop pairs with len ratio > this
  max_word_length: 40       # LongWordFilter: drop pairs with any word > this many chars
  # Structural symbols whose count must match between source and target; a
  # mismatch signals a broken/misaligned pair (truncation, glued-on editorial
  # notes, orphaned brackets). Brackets only -- quotes/apostrophes differ
  # legitimately across en/id. Set to "" to disable the check.
  symbol_check_chars: "()[]{}"
  # Download from https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin
  # and place at this path. If the file is missing, language filtering is skipped.
  fasttext_lid_model: data/lid.176.bin
  # CCMatrix is already an en-id parallel corpus ordered by LASER margin, so the
  # language pair is trustworthy by construction. A high threshold dropped ~16M
  # good pairs (fastText under-confident on short/mixed text). Relaxed to 0.3 so
  # only clear language mismatches are removed.
  language_confidence_threshold: 0.3

tokenizer:
  model_prefix: data/processed/spm_en_id
  vocab_size: 32000
  model_type: bpe
  character_coverage: 1.0
  split_digits: true
  byte_fallback: true
  # Fixed special token ids used everywhere downstream.
  unk_id: 0
  bos_id: 1
  eos_id: 2
  pad_id: 3
  # SentencePiece training samples this many sentences from the corpus.
  input_sentence_size: 5000000

teacher:
  # Sequence-level KD: the teacher translates the training sources once,
  # and students train on (source, teacher_translation) pairs.
  model_name: facebook/mbart-large-50-many-to-many-mmt
  source_lang_code: en_XX
  target_lang_code: id_ID
  batch_size: 32
  num_beams: 5
  max_new_tokens: 128

hyperparameter_search:
  # Optuna TPE sampler + Hyperband pruner over a resumable per-arch SQLite study
  # (results/hparam_search/<arch>.db). Objective = validation cross-entropy loss.
  # Every trial is held identical except the sampled hyperparameters: same seed,
  # same train slice (top-N highest-LASER-margin rows of train.tsv), same fixed
  # validation slice (first trial_validation_size rows of valid.tsv), same epochs.
  n_trials: 30                # Optuna trials per architecture
  trial_epochs: 3             # max epochs per trial; Hyperband prunes weak trials earlier
  subset_size: 300000         # top-N rows of train.tsv used to train each trial
  trial_validation_size: 10000 # first-N rows of valid.tsv used to score each trial
  sampler: tpe                # tpe | random
  pruner: hyperband           # hyperband | median | none
  save_diagram: best_only     # per-trial torchinfo summary always logged; graphviz
                              # diagram rendered for: best_only | all | none (needs torchview)
  # Search space per architecture. Types:
  #   [a, b]            -> categorical choice among the listed values
  #   {int:  [lo, hi]}  -> integer range (inclusive)
  #   {loguniform: [lo, hi]} -> float sampled log-uniformly
  #   {uniform: [lo, hi]}    -> float sampled uniformly
  search_space:
    gru:
      embedding_dim: [128, 256, 512]
      hidden_dim: [256, 512, 768, 1024]
      num_layers: {int: [1, 4]}
      dropout: {uniform: [0.1, 0.4]}
      learning_rate: {loguniform: [1.0e-4, 2.0e-3]}
      batch_size: [32, 64, 128]
    lstm:
      embedding_dim: [128, 256, 512]
      hidden_dim: [256, 512, 768, 1024]
      num_layers: {int: [1, 4]}
      dropout: {uniform: [0.1, 0.4]}
      learning_rate: {loguniform: [1.0e-4, 2.0e-3]}
      batch_size: [32, 64, 128]
    transformer:
      # d_model in {256, 512} is divisible by both num_heads {4, 8}, so every
      # sampled (d_model, num_heads) pair is valid -- no need to reject trials.
      d_model: [256, 512]
      num_heads: [4, 8]
      num_layers: {int: [2, 6]}
      ffn_dim: [1024, 2048, 3072]
      dropout: {uniform: [0.1, 0.3]}
      learning_rate: {loguniform: [1.0e-4, 1.0e-3]}
      batch_size: [32, 64, 128]

training:
  epochs: 20
  weight_decay: 0.01
  label_smoothing: 0.1
  grad_clip: 1.0
  early_stopping_patience: 3
  max_sequence_length: 128
  num_workers: 2
  # LR schedule: linear warmup then decay, stepped every optimizer step. Applied
  # in both the hyperparameter search and full training so a config's searched
  # behaviour transfers to the real runs. Transformers in particular train poorly
  # without warmup, so this is a fixed default (not a tuned hyperparameter).
  scheduler:
    type: cosine            # cosine | inverse_sqrt | none
    warmup_ratio: 0.06      # fraction of total planned steps spent warming up
    min_lr_ratio: 0.0       # cosine floor as a fraction of the peak LR

quantization:
  # Asymmetric per-tensor uint8 fake quantization (QAT), applied to nn.Linear layers.
  observer_momentum: 0.99

pruning:
  # Gradual, unstructured, per-tensor magnitude pruning of nn.Linear weights
  # (model/pruning.py), enabled with --prune. Composes with --qat in one run.
  target_sparsity: 0.5        # final fraction of Linear weights zeroed
  # Schedule as fractions of the planned total steps (steps_per_epoch * epochs):
  # a short dense warm-up, then a cubic ramp to target, then fine-tune at full
  # sparsity for the remainder (the phase that recovers accuracy).
  begin_step_fraction: 0.1
  end_step_fraction: 0.7
  update_frequency: 100       # recompute the mask every N optimizer steps
  # NOTE: the ramp is anchored to the planned epoch count. If early stopping
  # fires before end_step_fraction, target sparsity may not be reached. For
  # aggressive sparsity, raise training.early_stopping_patience (or epochs) so
  # the schedule completes and the model gets its post-ramp recovery phase.

evaluation:
  flores_split: devtest
  decode_max_length: 128
  decode_batch_size: 32
  latency_warmup: 5
  latency_repeats: 30
  # Reported metrics: BLEU (surface precision) + METEOR (recall + morphology +
  # synonymy). chrF++ is left implemented but OFF: it is another surface n-gram
  # overlap metric, and METEOR's Sastrawi stemming already recovers the
  # morphological credit chrF++ was there for -- so it is redundant here. Flip
  # to true to report it again.
  compute_chrf: false
  # Indonesian-aware METEOR (Sastrawi stemmer + Wordnet Bahasa via OMW lang="ind";
  # model/evaluation/meteor.py). Needs the nltk data, one time:
  #   python -c "import nltk; nltk.download('wordnet'); nltk.download('omw-1.4')"
  compute_meteor: true

coreml:
  minimum_deployment_target: iOS16
  max_source_length: 128
  max_target_length: 128
